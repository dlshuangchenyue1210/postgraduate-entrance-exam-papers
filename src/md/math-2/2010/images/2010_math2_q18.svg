<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 250" width="460" height="250" style="background: white; font-family: 'Times New Roman', Cambria, STIXGeneral, serif;">
  <!-- 1. 椭圆主体 (cx=160, cy=105, rx=130, ry=52) -->
  <ellipse cx="160" cy="105" rx="130" ry="52" fill="none" stroke="#000" stroke-width="2" />

  <!-- 2. 油面水平实线 (y = 79, x = 160 ± 130*sqrt(3)/2 = [47.42, 272.58]) -->
  <line x1="47.42" y1="79" x2="272.58" y2="79" stroke="#000" stroke-width="1.8" />

  <!-- 3. 油面下方 5 条等间距水平虚线 (间距 13) -->
  <line x1="34.12" y1="92" x2="285.88" y2="92" stroke="#000" stroke-width="1.2" stroke-dasharray="5,4" />
  <line x1="30.0" y1="105" x2="290.0" y2="105" stroke="#000" stroke-width="1.2" stroke-dasharray="5,4" />
  <line x1="34.12" y1="118" x2="285.88" y2="118" stroke="#000" stroke-width="1.2" stroke-dasharray="5,4" />
  <line x1="47.42" y1="131" x2="272.58" y2="131" stroke="#000" stroke-width="1.2" stroke-dasharray="5,4" />
  <line x1="74.14" y1="144" x2="245.86" y2="144" stroke="#000" stroke-width="1.2" stroke-dasharray="5,4" />

  <!-- 4. 右侧水平基准引出线 -->
  <!-- 顶部基准线 y = 53 -->
  <line x1="210" y1="53" x2="350" y2="53" stroke="#000" stroke-width="1.1" stroke-dasharray="5,4" />
  <line x1="350" y1="53" x2="385" y2="53" stroke="#000" stroke-width="1.3" />

  <!-- 油面基准线 y = 79 -->
  <line x1="272.58" y1="79" x2="350" y2="79" stroke="#000" stroke-width="1.1" stroke-dasharray="5,4" />
  <line x1="350" y1="79" x2="385" y2="79" stroke="#000" stroke-width="1.3" />

  <!-- 底部基准线 y = 157 -->
  <line x1="210" y1="157" x2="350" y2="157" stroke="#000" stroke-width="1.1" stroke-dasharray="5,4" />
  <line x1="350" y1="157" x2="385" y2="157" stroke="#000" stroke-width="1.3" />

  <!-- 5. 右侧垂直尺寸线与箭头 (位于 x = 370) -->
  <!-- 顶部向下箭头 (尖端指向 y=53 顶部基准线) -->
  <line x1="370" y1="25" x2="370" y2="45" stroke="#000" stroke-width="1.3" />
  <polygon points="366.5,45 370,53 373.5,45" fill="#000" />

  <!-- 顶部线到油面线之间的尺寸段 (y=53 到 y=79) -->
  <line x1="370" y1="53" x2="370" y2="79" stroke="#000" stroke-width="1.3" />

  <!-- 油面处向上箭头 (尖端指向 y=79 油面基准线) -->
  <polygon points="366.5,87 370,79 373.5,87" fill="#000" />

  <!-- 油面线到低部线之间的尺寸线 (y=87 到 y=149) -->
  <line x1="370" y1="87" x2="370" y2="149" stroke="#000" stroke-width="1.3" />

  <!-- 底部向下箭头 (尖端指向 y=157 底部基准线) -->
  <polygon points="366.5,149 370,157 373.5,149" fill="#000" />

  <!-- 6. 右侧外侧清晰标注 (位于 x = 390~400，彻底脱离狭缝) -->
  <!-- b/2 标注 (清晰位于外侧，字号放大，排版舒展) -->
  <g transform="translate(400, 66)">
    <!-- 分子 b -->
    <text x="0" y="-3" font-size="19" font-style="italic" text-anchor="middle">b</text>
    <!-- 分数横线 -->
    <line x1="-10" y1="0" x2="10" y2="0" stroke="#000" stroke-width="1.4" />
    <!-- 分母 2 -->
    <text x="0" y="16" font-size="17" text-anchor="middle">2</text>
  </g>

  <!-- 3/2 b 标注 (同样位于外侧，与 b/2 上下对齐，醒目清晰) -->
  <g transform="translate(400, 118)">
    <!-- 分子 3 -->
    <text x="-8" y="-3" font-size="18" text-anchor="middle">3</text>
    <!-- 分数横线 -->
    <line x1="-17" y1="0" x2="1" y2="0" stroke="#000" stroke-width="1.4" />
    <!-- 分母 2 -->
    <text x="-8" y="15" font-size="16" text-anchor="middle">2</text>
    <!-- 乘数 b -->
    <text x="9" y="8" font-size="20" font-style="italic">b</text>
  </g>

  <!-- 7. 底部 2a 尺寸标注 -->
  <!-- 左引出虚线与实线 (x = 30) -->
  <line x1="30" y1="105" x2="30" y2="168" stroke="#000" stroke-width="1.1" stroke-dasharray="5,4" />
  <line x1="30" y1="168" x2="30" y2="225" stroke="#000" stroke-width="1.3" />

  <!-- 右引出虚线与实线 (x = 290) -->
  <line x1="290" y1="105" x2="290" y2="168" stroke="#000" stroke-width="1.1" stroke-dasharray="5,4" />
  <line x1="290" y1="168" x2="290" y2="225" stroke="#000" stroke-width="1.3" />

  <!-- 水平双向尺寸线与箭头 (y = 208) -->
  <line x1="38" y1="208" x2="130" y2="208" stroke="#000" stroke-width="1.3" />
  <polygon points="38,204.5 30,208 38,211.5" fill="#000" />

  <line x1="190" y1="208" x2="282" y2="208" stroke="#000" stroke-width="1.3" />
  <polygon points="282,204.5 290,208 282,211.5" fill="#000" />

  <!-- 2a 文字 -->
  <text x="160" y="215" font-size="22" font-style="italic" text-anchor="middle">2a</text>
</svg>